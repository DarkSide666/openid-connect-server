<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">OIDC request-context lifecycle</title>
  <desc id="desc">Two separate HTTP requests. The authorize request stores nonce and max_age metadata durably against the authorization-code ID. The later token request consumes that metadata atomically and passes it through a new request-local context to the ID Token response.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#344054"/></marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#175CD3"/></marker>
    <style>
      .title{font:700 30px Arial,sans-serif;fill:#101828}
      .subtitle{font:400 17px Arial,sans-serif;fill:#475467}
      .lane{fill:#F8FAFC;stroke:#D0D5DD;stroke-width:2;rx:18}
      .lanehead{font:700 21px Arial,sans-serif;fill:#344054}
      .box{fill:#FFFFFF;stroke:#667085;stroke-width:2;rx:12}
      .context{fill:#EFF8FF;stroke:#2E90FA;stroke-width:2;rx:12}
      .store{fill:#ECFDF3;stroke:#12B76A;stroke-width:2;rx:12}
      .label{font:700 17px Arial,sans-serif;fill:#101828;text-anchor:middle}
      .small{font:400 15px Arial,sans-serif;fill:#344054;text-anchor:middle}
      .tiny{font:400 14px Arial,sans-serif;fill:#475467;text-anchor:middle}
      .arrow{fill:none;stroke:#344054;stroke-width:3;marker-end:url(#arrow)}
      .arrowblue{fill:none;stroke:#175CD3;stroke-width:3;marker-end:url(#arrowBlue)}
      .tag{font:700 14px Arial,sans-serif;fill:#175CD3;text-anchor:middle}
      .foot{font:400 15px Arial,sans-serif;fill:#475467}
    </style>
  </defs>
  <rect width="1440" height="900" fill="#FFFFFF"/>
  <text x="60" y="62" class="title">OIDC request-context lifecycle</text>
  <text x="60" y="94" class="subtitle">The durable metadata store connects two HTTP requests; the in-memory context does not.</text>

  <rect x="55" y="130" width="630" height="630" class="lane"/>
  <rect x="755" y="130" width="630" height="630" class="lane"/>
  <text x="85" y="174" class="lanehead">HTTP request A — GET /authorize</text>
  <text x="785" y="174" class="lanehead">HTTP request B — POST /token</text>

  <rect x="190" y="215" width="360" height="86" class="box"/>
  <text x="370" y="249" class="label">OidcAuthCodeGrant</text>
  <text x="370" y="276" class="small">validates openid, nonce and PKCE S256</text>

  <rect x="190" y="340" width="360" height="86" class="context"/>
  <text x="370" y="374" class="label">Request-local context A</text>
  <text x="370" y="401" class="small">holds pending nonce / max_age</text>
  <path d="M370 301 L370 338" class="arrowblue"/>

  <rect x="190" y="470" width="360" height="92" class="box"/>
  <text x="370" y="505" class="label">OidcAuthCodeRepository</text>
  <text x="370" y="532" class="small">stores metadata against authorization-code ID</text>
  <path d="M370 426 L370 468" class="arrowblue"/>

  <rect x="835" y="470" width="470" height="92" class="store"/>
  <text x="1070" y="505" class="label">Durable metadata store</text>
  <text x="1070" y="532" class="small">authorization-code ID → nonce / max_age / expiry</text>
  <path d="M550 516 L833 516" class="arrow"/>
  <text x="690" y="495" class="tag">persist</text>

  <rect x="835" y="215" width="470" height="86" class="box"/>
  <text x="1070" y="249" class="label">League validates token request</text>
  <text x="1070" y="276" class="small">client, code, redirect URI and PKCE proof</text>

  <rect x="835" y="340" width="470" height="86" class="context"/>
  <text x="1070" y="374" class="label">New request-local context B</text>
  <text x="1070" y="401" class="small">starts empty; separate from context A</text>

  <rect x="835" y="605" width="470" height="86" class="box"/>
  <text x="1070" y="639" class="label">OidcBearerTokenResponse</text>
  <text x="1070" y="666" class="small">uses context B to issue the ID Token</text>

  <path d="M1070 301 L1070 338" class="arrowblue"/>
  <path d="M1070 562 L1070 603" class="arrow"/>
  <path d="M1070 426 L1070 468" class="arrowblue"/>
  <text x="1185" y="450" class="tag">atomic consume</text>
  <path d="M835 516 C760 516 760 648 833 648" class="arrow"/>
  <text x="755" y="610" class="tag">metadata</text>

  <rect x="190" y="605" width="360" height="86" class="context"/>
  <text x="370" y="639" class="label">Request A ends</text>
  <text x="370" y="666" class="small">context A is discarded</text>
  <path d="M370 562 L370 603" class="arrowblue"/>

  <text x="60" y="812" class="foot">Blue boxes: in-memory request-local context. Green box: durable storage shared across requests.</text>
  <text x="60" y="842" class="foot">The same context-provider service is injected into the grant, repository decorator and token response within each request.</text>
</svg>
